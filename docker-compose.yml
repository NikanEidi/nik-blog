services:
  postgres:
    # pgvector's own image, built on top of postgres:17 — same Postgres,
    # just with the `vector` extension already compiled in. Needed for the
    # Nik-Blog Assistant's document_chunks table.
    image: pgvector/pgvector:pg17
    container_name: nikblog-postgres
    environment:
      POSTGRES_USER: nikblog
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nikblog
    ports:
      - "5434:5432"
    volumes:
      - nikblog_pg_data:/var/lib/postgresql/data

volumes:
  nikblog_pg_data: